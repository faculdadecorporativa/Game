        // === Initialize PocketBase Globally ===
        window.pb = new PocketBase('https://pb.faculdadecorporativa.com.br');

        window.lessonData = JSON.parse(JSON.stringify(defaultLessonData));
        window.cyberSecurityMockData = cyberSecurityMockData;
        window.appState = appStore.state; 

        window.sfx = {
            play(type) {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    
                    osc.connect(gain); 
                    gain.connect(ctx.destination);
                    
                    if(type === 'correct') {
                        osc.frequency.setValueAtTime(440, ctx.currentTime);
                        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1);
                    } else if(type === 'wrong') {
                        osc.frequency.setValueAtTime(300, ctx.currentTime);
                        osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.2);
                        osc.type = 'square';
                    } else {
                        osc.frequency.setValueAtTime(600, ctx.currentTime);
                    }
                    
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    
                    osc.start(); 
                    osc.stop(ctx.currentTime + 0.2);
                } catch(e) { console.warn("AudioContext not allowed yet."); }
            }
        };

        window.toast = (msg, isSuccess) => {
            const c = document.getElementById('toast-container'); 
            if(!c) return;
            const el = document.createElement('div');
            el.className = `toast-enter max-w-[400px] w-full px-5 py-4 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.12)] dark:shadow-[0_8px_32px_rgba(0,0,0,0.5)] bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl font-semibold text-sm sm:text-base text-slate-800 dark:text-slate-100 border border-white/40 dark:border-white/10 ${isSuccess ? 'border-l-4 border-l-indigo-600 dark:border-l-indigo-500' : 'border-l-4 border-l-rose-500 dark:border-l-rose-500'} flex items-start gap-3 transition-colors duration-300`;
            el.innerHTML = `<span class="text-xl mt-0.5 dark:drop-shadow-md">${isSuccess ? '💡' : '⚠️'}</span> <span class="leading-relaxed">${msg}</span>`; 
            c.appendChild(el);
            setTimeout(() => { el.classList.replace('toast-enter', 'toast-exit'); setTimeout(() => el.remove(), 400); }, 6000); 
        };
        
        window.speakText = (text) => { if ('speechSynthesis' in window) { window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); window.speechSynthesis.speak(u); } };
        window.shuffleArray = (arr) => arr.sort(() => Math.random() - 0.5);

        window.app = app;
        window.appStore = appStore;
        window.authManager = authManager;
        window.authUI = authUI; 
        window.adminUI = adminUI; 
        window.timerManager = timerManager;
        window.game = game;
        window.lifelineManager = lifelineManager;
        window.uiManager = uiManager;
        window.aiSimulator = aiSimulator;
        window.dashboardController = dashboardController;
        window.shopController = shopController;
        window.syncManager = syncManager;
        window.databaseJanitor = databaseJanitor;

        // Uses the newly initialized PocketBase instance
        window.progressController = new ProgressController(window.pb || null, window.appStore);

        if(typeof systemsCheck !== 'undefined' && systemsCheck.run) {
            systemsCheck.run();
        }
    </script>
</body>
</html>
