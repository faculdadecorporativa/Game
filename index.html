    <script type="module">
        import { app } from './network.js';
        import { defaultLessonData, cyberSecurityMockData } from './data.js';
        import { authManager } from './auth.js';
        import { authUI } from './authController.js';
        import { appStore } from './store.js';
        import { adminUI } from './AdminController.js';
        import { uiManager } from './UIController.js';
        import { game } from './GameController.js';
        import { lifelineManager } from './LifelineController.js';
        import { shopManager, aiSimulator, timerManager, imageManager } from './Utilities.js';
        import { systemsCheck } from './SystemsCheck.js';

        import './AppHeader.js';
        import './AppModals.js';
        import './RoleSelection.js';
        import './ModuleJoinPin.js'; 
        import './ProfDashboard.js';
        import './StudentLobby.js';
        import { dashboardController } from './StudentDashboardController.js';
        import { shopController } from './ShopController.js';
        import './ModuleOne.js';
        import './ModuleTwo.js';
        import './ModuleThree.js'; 
        import './ModuleFour.js'; 
        import './ModuleFive.js'; 
        import './ModuleSix.js';
        import './ModuleSeven.js';
        import './ModuleEight.js';
        import './ModuleNine.js';
        import './ModuleTen.js';
        import './ModuleEleven.js';
        import './ModuleTwelve.js';
        import { syncManager } from './StateSyncController.js';
        import { databaseJanitor } from './JanitorController.js';

        window.lessonData = JSON.parse(JSON.stringify(defaultLessonData));
        window.cyberSecurityMockData = cyberSecurityMockData;
        window.appState = appStore.state; 

        window.sfx = {
            play(type) {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.start(); osc.stop(ctx.currentTime + 0.1);
                } catch(e) { }
            }
        };

        window.toast = (msg, isSuccess) => {
            const c = document.getElementById('toast-container'); const el = document.createElement('div');
            el.className = `toast-enter max-w-[400px] w-full px-5 py-4 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.12)] dark:shadow-[0_8px_32px_rgba(0,0,0,0.5)] bg-white/60 dark:bg-slate-900/40 backdrop-blur-2xl font-semibold text-sm sm:text-base text-slate-800 dark:text-slate-100 border border-white/40 dark:border-white/10 ${isSuccess ? 'border-l-4 border-l-indigo-600 dark:border-l-indigo-500' : 'border-l-4 border-l-rose-500 dark:border-l-rose-500'} flex items-start gap-3 transition-colors duration-300`;
            el.innerHTML = `<span class="text-xl mt-0.5 dark:drop-shadow-md">${isSuccess ? '💡' : '⚠️'}</span> <span class="leading-relaxed">${msg}</span>`; 
            c.appendChild(el);
            setTimeout(() => { el.classList.replace('toast-enter', 'toast-exit'); setTimeout(() => el.remove(), 400); }, 6000); 
        };
        
        window.speakText = (text) => { if ('speechSynthesis' in window) { window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); window.speechSynthesis.speak(u); } };
        window.shuffleArray = (arr) => arr.sort(() => Math.random() - 0.5);

        window.app = app;
        window.appStore = appStore;
        window.authManager = authManager;
        window.authUI = authUI; 
        window.adminUI = adminUI; 
        window.timerManager = timerManager;
        window.game = game;
        window.lifelineManager = lifelineManager;
        window.uiManager = uiManager;
        window.shopManager = shopManager;
        window.aiSimulator = aiSimulator;
        window.imageManager = imageManager;
        window.dashboardController = dashboardController;
        window.shopController = shopController;
        window.syncManager = syncManager;
        window.databaseJanitor = databaseJanitor;

        if(typeof systemsCheck !== 'undefined' && systemsCheck.run) {
            systemsCheck.run();
        }
    </script>
